    "nerve": "Median nerve: 2nd and 3rd fingers and deep branch of ulnar nerve: 4th and 5th fingers (C8-T1)"
            },
];

let currentIndex = 0;

function generateFlashcards(indexOffset = 0) {
    const flashcardContainer = document.getElementById('flashcardContainer');
    flashcardContainer.innerHTML = '';

    const startIndex = Math.max(0, currentIndex + indexOffset);
    const endIndex = Math.min(startIndex + 3, muscleData.length * 4);

    for (let i = startIndex; i < endIndex; i++) {
        const data = muscleData[Math.floor(i / 4)];
        const type = i % 4;

        let question = '';
        let answer = '';

        switch (type) {
            case 0:
                question = `What is the origin of ${data.muscle}?`;
                answer = data.origin;
                break;
            case 1:
                question = `What is the insertion of ${data.muscle}?`;
                answer = data.insertion;
                break;
            case 2:
                question = `What nerve innervates the ${data.muscle}?`;
                answer = data.nerve;
                break;
            case 3:
                question = `What is the function of ${data.muscle}?`;
                answer = data.function;
                break;
        }

        createFlashcard(flashcardContainer, question, answer);
    }

    currentIndex = startIndex;
}

function randomizeFlashcards() {
    const flashcardContainer = document.getElementById('flashcardContainer');
    flashcardContainer.innerHTML = '';

    const usedIndexes = new Set();

    while (usedIndexes.size < 3) {
        const randomIndex = Math.floor(Math.random() * muscleData.length * 4);
        if (!usedIndexes.has(randomIndex)) {
            usedIndexes.add(randomIndex);

            const data = muscleData[Math.floor(randomIndex / 4)];
            const type = randomIndex % 4;

            let question = '';
            let answer = '';

            switch (type) {
                case 0:
                    question = `What is the origin of ${data.muscle}?`;
                    answer = data.origin;
                    break;
                case 1:
                    question = `What is the insertion of ${data.muscle}?`;
                    answer = data.insertion;
                    break;
                case 2:
                    question = `What nerve innervates the ${data.muscle}?`;
                    answer = data.nerve;
                    break;
                case 3:
                    question = `What is the function of ${data.muscle}?`;
                    answer = data.function;
                    break;
            }

            createFlashcard(flashcardContainer, question, answer);
        }
    }
}

function createFlashcard(container, question, answer) {
    const flashcard = document.createElement('div');
    flashcard.classList.add('flashcard');

    const questionElement = document.createElement('div');
    questionElement.classList.add('question');
    questionElement.innerText = question;

    const answerElement = document.createElement('div');
    answerElement.classList.add('answer');
    answerElement.innerText = answer;

    flashcard.appendChild(questionElement);
    flashcard.appendChild(answerElement);

    flashcard.addEventListener('click', () => {
        answerElement.classList.toggle('show');
    });

    container.appendChild(flashcard);
}

document.getElementById('nextButton').addEventListener('click', () => generateFlashcards(3));
document.getElementById('prevButton').addEventListener('click', () => generateFlashcards(-3));
document.getElementById('randomButton').addEventListener('click', randomizeFlashcards);

// Generate the initial set of flashcards
generateFlashcards();
</script>
